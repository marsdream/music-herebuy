name: Weekly Charts Pipeline

on:
  schedule:
    - cron: '30 7 * * 1'
    - cron: '30 7 * * 3'
    - cron: '30 7 * * 5'
  workflow_dispatch: {}

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary httpx boto3

      - name: Run Last.fm fetch
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          mkdir -p ~/.openclaw/credentials
          echo '{"api_key":"'"$LASTFM_API_KEY"'","secret":"dummy"}' > ~/.openclaw/credentials/lastfm.json
          echo '{"project_ref":"adfirxacvkcoasbujbgo","project_url":"https://adfirxacvkcoasbujbgo.supabase.co","rest_api":"https://adfirxacvkcoasbujbgo.supabase.co/rest/v1","db_host":"db.adfirxacvkcoasbujbgo.supabase.co","db_password":"'"$SUPABASE_DB_PASSWORD"'","personal_access_token":"'"$SUPABASE_PAT"'"}' > ~/.openclaw/credentials/supabase.json
          echo "$SUPABASE_SERVICE_ROLE_KEY" > ~/.openclaw/credentials/supabase_service_role_key.txt
          python3 ci/scripts/lastfm_fetch.py

      - name: Run Billboard fetch
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python3 ci/scripts/billboard_fetch.py

      - name: Run QQ Music fetch
        env:
          QQMUSIC_API_KEY: ${{ secrets.QQMUSIC_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 ci/scripts/qqmusic_fetch.py

      - name: Run MusicBrainz lookup
        run: python3 ci/scripts/musicbrainz_lookup.py

      - name: Run AI analyze
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          echo "$ZHIPU_API_KEY" > ~/.openclaw/credentials/minimax-portal_api_key.txt
          python3 ci/scripts/ai_analyze.py

      - name: Fetch album covers
        env:
          S1YUNPAN_ACCESS_KEY_ID: ${{ secrets.S1YUNPAN_ACCESS_KEY_ID }}
          S1YUNPAN_SECRET_ACCESS_KEY: ${{ secrets.S1YUNPAN_SECRET_ACCESS_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 ci/scripts/fetch_covers.py
